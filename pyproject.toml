[project]
name = "ketik-audio"
version = "0.1.0"
description = "Eksperimen lokal pengenalan tombol keyboard dari suara ketikan"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "sounddevice>=0.5,<0.6",
  "soundfile>=0.13,<0.14",
  "librosa>=0.11,<0.12",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "torch==2.14.0",
  "matplotlib>=3.9,<4",
]

[project.scripts]
ketik = "ketik_audio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.hatch.build.targets.wheel.force-include]
"research/licenses/harrison-MIT.txt" = "ketik_audio/licenses/harrison-MIT.txt"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["research/vendor", ".venv*", "data", "runs", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Frozen by the timing audit; two literal status/provenance strings exceed 100 columns.
"research/align_skaid.py" = ["E501"]
